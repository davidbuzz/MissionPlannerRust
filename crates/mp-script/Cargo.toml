[package]
name = "mp-script"
description = "The scripting host API, and what the shipped scripts need from it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `host_env` is what gives scripts `os`, `socket`, `time` and `select`, which IronPython gives them
# and which example6, example9 and debugenv use. It compiles RustPython's posix module, and that
# module (rustpython-vm 0.5.0, `src/stdlib/posix.rs:1812`) passes `libc::POSIX_SPAWN_SETSID` as an
# int, which libc 0.2.189 made a short: Cargo.lock holds libc at 0.2.185, the newest that wasmtime
# 48 accepts and that still types it as an int (`cargo update -p libc --precise 0.2.185`). A
# `cargo update` that moves libc past 0.2.188 breaks this build until RustPython releases the fix.
rustpython = { version = "0.5", default-features = false, features = ["stdlib", "freeze-stdlib", "host_env"] }
# The class and method attribute macros expand to `::rustpython_vm::...`, so the VM crate has to
# be a direct dependency under that name; it is the same crate `rustpython::vm` re-exports.
rustpython-vm = { version = "0.5", default-features = false }
thiserror.workspace = true
