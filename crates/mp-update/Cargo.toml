[package]
name = "mp-update"
description = "The planner's own update: a release's manifest read, its archive fetched, checked and moved into place"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The std calls that panic in a web page, std's on the desktop (web/tools/port_os.py).
mp-os.workspace = true
# The manifest, `update.json`.
serde_json.workspace = true

# Everything that fetches, unpacks and installs: not in a web page, which is whatever its site
# serves and has no install to update.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The planner's User-Agent.
mp-firmware.workspace = true
# The Windows release's zip.
mp-log.workspace = true
# The network.
ureq.workspace = true
# A download's SHA-256, checked against the manifest's.
sha2.workspace = true
# The Linux and macOS releases' `.tar.gz`.
flate2.workspace = true
tar.workspace = true
