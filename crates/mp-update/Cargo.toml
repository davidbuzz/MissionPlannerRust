[package]
name = "mp-update"
description = "Mission Planner's update check and updater: Utilities/Update.cs and Updater/Program.cs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The std calls that panic in a web page, std's on the desktop (web/tools/port_os.py).
mp-os.workspace = true
# Threads, std's on the desktop and Web Workers in a web page (web/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (web/tools/port_clock.py).
web-time = "1"
# The network, as `Download`'s `HttpClient`: the `Fetch` trait the firmware code fetches through.
mp-firmware.workspace = true
# The zip the beta and master channels are read from (`GetNewFileZip`).
mp-log.workspace = true
# `CheckMD5`'s `Regex`.
regex.workspace = true
