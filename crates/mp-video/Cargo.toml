[package]
name = "mp-video"
description = "Video capture for the HUD: the Planner page's Video Device and Video Format, Start and Stop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The std calls that panic in a web page, std's on the desktop (web/tools/port_os.py).
mp-os.workspace = true
# Threads, std's on the desktop and Web Workers in a web page (web/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (web/tools/port_clock.py).
web-time = "1"
image.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# V4L2 through ioctls, no libv4l. Its `v4l2-sys-mit` runs bindgen over <linux/videodev2.h> at
# build time, so a Linux build needs libclang and the kernel's UAPI headers (linux-libc-dev);
# nothing links against them.
v4l = { version = "0.14", default-features = false, features = ["v4l2"] }

[target.'cfg(windows)'.dependencies]
# Media Foundation for the Windows source, at the version gpui already builds; `windows-core`
# named as well because the callback's `#[implement]` expands to paths under it.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
windows-core = "0.62"
