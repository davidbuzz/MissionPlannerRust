[package]
name = "mp-firmware"
description = "Firmware files and the px4 bootloader protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The std calls that panic in a web page, std's on the desktop (web/tools/port_os.py).
mp-os.workspace = true
# Threads, std's on the desktop and Web Workers in a web page (web/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (web/tools/port_clock.py).
web-time = "1"
thiserror.workspace = true
# The .apj/.px4 container is JSON holding a base64 zlib stream. All three are already compiled in
# this workspace's dependency closure, so none of them costs a new build.
# `preserve_order`: a signed `.apj` is written back in the order its keys were read, as
# Newtonsoft's JObject keeps them (signed.rs).
serde_json = { workspace = true, features = ["preserve_order"] }
base64.workspace = true
flate2.workspace = true
# Ed25519 and SHA-512 for the Secure page's signing (signed.rs, SignedFW.cs's BouncyCastle):
# already compiled into this crate as rustls' cryptography, under ureq, so it adds no build.
ring = "0.17"
# Board detection probes ports through the same transport the link uses, and reads its PortInfo.
mp-transport.workspace = true
# The firmware catalogue (manifest.rs): fetched as mp-params fetches parameter documentation,
# blocking, on a thread of the caller's choosing; the C#'s VID/PID pattern; and serde itself, so
# the 77 MB manifest is read record by record instead of as one JSON tree. All three are already
# compiled for other crates in this workspace.
ureq.workspace = true
regex.workspace = true
serde = "1"
# The legacy catalogue, firmware2.xml (legacy.rs), read as mp-params reads apm.pdef.xml.
roxmltree.workspace = true

[dev-dependencies]
# For TTYPort::pair(): the bootloader probe is run over a real serial port on a pseudo-terminal.
serialport = { version = "4.10", default-features = false }

# HTTPS in a web page (the browser experiment), for ring and rustls under ureq: ring's random
# numbers from `crypto.getRandomValues` (getrandom 0.2's "js", which ring's own feature turns on),
# and rustls' clock from the browser's (pki-types' "web").
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
