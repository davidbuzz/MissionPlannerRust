[package]
name = "mp-transport"
description = "Link transports: serial, TCP, UDP, file replay, and test doubles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["serial"]
# Serial support pulls a native dependency; headless CI and replay-only builds can drop it.
serial = ["dep:serialport"]

[dependencies]
# The std calls that panic in a web page, std's on the desktop (experiments/web-experiment/tools/port_os.py).
mp-os.workspace = true
# Threads, std's on the desktop and Web Workers in a web page (experiments/web-experiment/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (experiments/web-experiment/tools/port_clock.py).
web-time = "1"
thiserror.workspace = true
serialport = { version = "4.10", optional = true }

# Windows' own record of each COM port, as Mission Planner's Win32DeviceMgmt reads it (src/win32.rs);
# the version the serialport crate already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
] }

[dev-dependencies]
mp-mavlink.workspace = true
mp-mavlink-dialects.workspace = true
# For TTYPort::pair(): a pseudo-terminal is the one real serial port a test can unplug.
serialport = { version = "4.10", default-features = false }
criterion.workspace = true

# Deliverable 3: what a transport adds to a raw OS read, over TCP and a pseudo-terminal.
[[bench]]
name = "latency"
harness = false

# The page's side of a browser build's links (src/page.rs): three calls the page's script makes.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
