[package]
name = "mp-units"
description = "Typed units and geodesy primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The clock, std's on the desktop and the browser's in a web page (experiments/web-experiment/tools/port_clock.py).
web-time = "1"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

# Deliverable 8's pan/zoom budget: the map's per-frame CPU work at 2560x1440 with a 1M-point track and 10k
# markers. Here rather than in mp-gui because mp-gui has no library target to bench.
[[bench]]
name = "pan_zoom"
harness = false
