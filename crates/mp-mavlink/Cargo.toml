[package]
name = "mp-mavlink"
description = "MAVLink v1/v2 frame codec: zero-copy parse, allocation-free encode, v2 signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Threads, std's on the desktop and Web Workers in a web page (experiments/web-experiment/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# Only for tests/no_alloc.rs, which must decode real frames into typed messages to prove the
# whole decode path allocation-free. A dev-dependency cycle is fine for integration tests: they
# link the same non-test build of this crate that the dialect crate does.
mp-mavlink-dialects.workspace = true

[[bench]]
name = "decode"
harness = false
