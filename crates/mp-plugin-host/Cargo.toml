[package]
name = "mp-plugin-host"
description = "The WebAssembly plugin host: Mission Planner's plugins on wasmtime's component model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The experiment's wasmtime (PLAN.md §13.6 row 95), with the component model: the WIT world in
# `wit/` is the plugin interface, typed strings, records and lists across it. Cranelift compiles;
# fuel stops a runaway plugin.
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "std", "anyhow", "component-model"] }
# A plugin built for wasm32-unknown-unknown with wit-bindgen is a core module carrying its WIT;
# this makes it the component the host loads, so a plugin author needs no second tool. At the
# wasmparser and wit-parser wasmtime 48 already builds (0.254).
wit-component = "0.254"
anyhow.workspace = true
