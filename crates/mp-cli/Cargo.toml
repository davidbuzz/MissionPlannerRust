[package]
name = "mp-cli"
description = "Command line front end: connect to a vehicle and watch telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "headless-planner"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mp-link.workspace = true
mp-params.workspace = true
mp-mavlink.workspace = true
mp-mavlink-dialects.workspace = true
mp-transport.workspace = true
mp-vehicle.workspace = true
mp-firmware.workspace = true
# `headless-planner update-apply`, the planner's updater (`Updater/Program.cs`).
mp-update.workspace = true
mp-kml.workspace = true
mp-log.workspace = true
# `headless-planner magcal`: MagCalib.cs's fit.
mp-calibration.workspace = true
mp-mission.workspace = true
mp-units.workspace = true
# The data directory and the settings the verbs read.
mp-settings.workspace = true
# `headless-planner terrain`: srtm.getAltitude over the planner's terrain cache.
mp-terrain.workspace = true
# `headless-planner georef`: the Geo Reference Images form's buttons.
mp-georef.workspace = true
