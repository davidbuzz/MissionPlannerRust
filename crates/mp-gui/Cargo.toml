[package]
name = "mp-gui"
description = "The graphical front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mpr-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Pinned to the zed tree rather than the crates.io release. The published gpui 0.2.2 is an older,
# self-contained snapshot that still uses the blade renderer and has no web backend; the current
# tree is wgpu on Linux and web, Direct3D 11 on Windows, Metal on macOS, and gpui_web makes a
# WASM build structurally possible. Staying on the tree is also how Zed itself consumes it.
#
# gpui_platform cfg-selects the backend per target, so Windows and wasm need no changes here.
gpui = { git = "https://github.com/zed-industries/zed", rev = "62e5991dd0f0c8a3af8d5e7e9c4652490d468db8" }
mp-link.workspace = true
mp-params.workspace = true
mp-vehicle.workspace = true
mp-units.workspace = true
mp-settings.workspace = true
mp-mission.workspace = true
mp-tiles.workspace = true
mp-mavlink-dialects.workspace = true
mp-input.workspace = true
mp-chart.workspace = true
mp-log.workspace = true

# Local time, for naming a flight recording the way the pilot's own clock reads. std has no
# timezone support at all, and the alternatives are worse: libc's localtime_r needs unsafe, which
# the workspace denies, and time's now_local refuses to answer in a multi-threaded process, which
# this is by the time a link is open. Free here - gpui already depends on chrono, so it is
# compiled either way.
chrono = { workspace = true }

# Constructing a gpui RenderImage needs image::Frame, and gpui does not re-export the image crate.
# The same version mp-tiles decodes with, so a tile crosses the boundary without converting.
image.workspace = true

# The backend crate per platform, mirroring what gpui_platform does. Selecting it here rather
# than depending on gpui_platform avoids an inherited-dependency resolution problem: consumed as
# a git dependency, gpui_platform's `gpui.workspace = true` resolves against crates.io, where an
# unrelated crate of the same name exists at a higher version.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "62e5991dd0f0c8a3af8d5e7e9c4652490d468db8" }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "62e5991dd0f0c8a3af8d5e7e9c4652490d468db8" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "62e5991dd0f0c8a3af8d5e7e9c4652490d468db8" }
