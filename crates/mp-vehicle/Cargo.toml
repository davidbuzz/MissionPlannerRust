[package]
name = "mp-vehicle"
description = "Decoded vehicle state and the telemetry snapshot bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Threads, std's on the desktop and Web Workers in a web page (experiments/web-experiment/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (experiments/web-experiment/tools/port_clock.py).
web-time = "1"
mp-mavlink.workspace = true
mp-mavlink-dialects.workspace = true
mp-units.workspace = true
arc-swap = "1.9"

[dev-dependencies]
mp-transport.workspace = true
criterion.workspace = true

# Deliverable 5's snapshot bus: publish and load latency, a writer at 1 kHz under eight readers.
[[bench]]
name = "snapshot"
harness = false
