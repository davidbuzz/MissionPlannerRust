[package]
name = "mp-log"
description = "Telemetry log reading (tlog) and dataflash parsing, compatible with Mission Planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The std calls that panic in a web page, std's on the desktop (web/tools/port_os.py).
mp-os.workspace = true
# Threads, std's on the desktop and Web Workers in a web page (web/tools/port_threads.py).
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }
# The clock, std's on the desktop and the browser's in a web page (web/tools/port_clock.py).
web-time = "1"
mp-mavlink.workspace = true
# `log_sort`'s "Move log" lines, as LogSort.cs logs them.
log.workspace = true
thiserror.workspace = true
# The .kmz "Create KML + gpx" writes and the analyzer zip "Auto Analysis" unpacks.
flate2.workspace = true
# The analyzer's XML report.
roxmltree.workspace = true
# The flight mode tables `BinaryLog.onFlightMode` names modes from (L3, below this crate's L4).
mp-vehicle.workspace = true
# The FFT window's transform (`mp_log::fft`), in place of `FFT2.run`.
rustfft.workspace = true
# `magcal_log`: `MagCalib.ProcessLog`'s fit (L3, below), the messages its telemetry logs are read
# into, and the drawing `doDXF` writes with netDxf.
mp-calibration.workspace = true
mp-mavlink-dialects.workspace = true
dxf.workspace = true

[dev-dependencies]
# The tlog writer is the link's recorder; the round-trip tests read back what it writes.
mp-link.workspace = true
criterion.workspace = true

# Deliverable 14's parse budget: a 1 GB dataflash log opened to its first plot in under two seconds.
[[bench]]
name = "parse_1gb"
harness = false
