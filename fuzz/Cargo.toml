[package]
name = "mp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The properties themselves, shared with the stable harness in crates/mp-fuzz-checks so that a
# target cannot drift from what `cargo test --workspace` actually checks.
mp-fuzz-checks = { path = "../crates/mp-fuzz-checks" }

[[bin]]
name = "frame_parse"
path = "fuzz_targets/frame_parse.rs"
test = false
doc = false
bench = false

