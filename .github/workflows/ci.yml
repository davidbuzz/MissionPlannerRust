name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      # gpui's X11 backend needs these to link; a machine that can run X11 software can still
      # fail to link it, because the bare .so symlinks live in the -dev packages.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev libudev-dev xvfb \
            libclang-dev linux-libc-dev  # mp-video: v4l2-sys-mit runs bindgen at build time (PLAN §13.6 row 84)
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The porting ledger: one row per C# file, every row well-formed. The C# tree is not
      # checked out here, so this validates the CSV on its own and says so; a row whose state
      # claims evidence that does not exist still fails.
      - run: cargo xtask ledger check

      # Open a window and paint it, on every platform.
      #
      # This is the only thing in CI that exercises a graphics backend. Everything above compiles
      # the renderer and never runs it, so a backend that will not initialise, a surface it cannot
      # create or a shader that will not compile is invisible - it kills the application at
      # startup on the machine that has the problem and nowhere else. Windows is why this exists:
      # the Direct3D 11 path had never been run at all, because nobody on the project has a
      # Windows machine.
      #
      # MP_SMOKE makes the real binary exit 0 once it has painted three frames and non-zero if it
      # has not painted them within thirty seconds. Tiles are off so the result does not depend on
      # a tile server, and recording is off so a runner does not accumulate .tlog files.
      - name: Build the GUI
        run: cargo build -p mp-gui
      - name: Window opens and paints (Linux)
        if: runner.os == 'Linux'
        env: { MP_SMOKE: "1", MP_NO_TILES: "1", MP_NO_RECORD: "1" }
        # A runner has no display, so one is supplied. llvmpipe does the rendering, which is slow
        # and entirely sufficient: the question is whether the backend comes up, not how fast.
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" ./target/debug/mpr-gui
      # Named separately from macOS only because of the extension; the runner has a desktop
      # session, and Direct3D 11 falls back to WARP, the software rasteriser, where there is no
      # GPU. WARP still goes through the whole backend - device, swap chain, shaders - which is
      # what is being checked.
      - name: Window opens and paints (Windows)
        if: runner.os == 'Windows'
        env: { MP_SMOKE: "1", MP_NO_TILES: "1", MP_NO_RECORD: "1" }
        run: ./target/debug/mpr-gui.exe
      - name: Window opens and paints (macOS)
        if: runner.os == 'macOS'
        env: { MP_SMOKE: "1", MP_NO_TILES: "1", MP_NO_RECORD: "1" }
        run: ./target/debug/mpr-gui

  cross-compile:
    name: cross-compile targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu, wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # The core stays portable whether or not anyone is currently building for these targets.
      # Checking it here is cheaper than discovering it at release time.
      - name: Windows
        run: cargo check --target x86_64-pc-windows-gnu
             -p mp-mavlink -p mp-mavlink-dialects -p mp-transport -p mp-vehicle
             -p mp-link -p mp-params -p mp-calibration -p mp-ftp -p mp-log -p mp-units
             -p mp-mission -p mp-cli
      - name: wasm
        run: cargo check --target wasm32-unknown-unknown
             -p mp-mavlink -p mp-mavlink-dialects -p mp-units -p mp-log
             -p mp-vehicle -p mp-mission

  sitl:
    name: integration against ArduPilot SITL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The SITL binary is committed under tools/sitl, so this needs no ArduPilot checkout.
      - name: Start SITL
        run: |
          tools/sitl/run-sitl.sh copter > /tmp/sitl.log 2>&1 &
          for _ in $(seq 1 60); do
            ss -tln | grep -q 5760 && break
            sleep 1
          done
          ss -tln | grep -q 5760 || { echo "SITL did not start"; cat /tmp/sitl.log; exit 1; }
      # These are the tests that catch what unit tests cannot: a protocol that stalls because the
      # vehicle answers with a different message than expected, and parameter values that decode
      # to numbers no battery or system id could hold.
      # Serially: SITL serves one TCP client at a time, so tests that each open a link must not
      # overlap. Within a binary that needs --test-threads=1; between binaries cargo already
      # runs sequentially.
      - run: cargo test --workspace -- --ignored --test-threads=1
      - name: SITL log on failure
        if: failure()
        run: cat /tmp/sitl.log

  fuzz:
    name: bounded fuzz pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly, because libFuzzer needs it. This is the only job that does, which is why the
      # fuzz crate is excluded from the workspace - an ordinary build must not require it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Bounded rather than the 24 hours D2 asks for on frame_parse. A CI job is a regression
      # check: it proves the targets still build and still hold, and it is the long soak that
      # finds new things. frame_parse gets the longest slice because it is the one on the
      # telemetry path, where every byte is attacker-influenced in the sense that matters.
      - name: frame_parse
        run: tools/fuzz.sh frame_parse -max_total_time=180
      - name: frame_stream
        run: tools/fuzz.sh frame_stream -max_total_time=120
      - name: waypoint_file
        run: tools/fuzz.sh waypoint_file -max_total_time=60
      - name: tlog_reader
        run: tools/fuzz.sh tlog_reader -max_total_time=60
      # The one that reaches the per-message decoders, which is 150x more of the codebase than
      # frame_parse reaches - so it gets a slice to match.
      - name: message_decode
        run: tools/fuzz.sh message_decode -max_total_time=180
      # A crash leaves its input behind; without this the job fails and the input that caused it
      # is gone, which makes the failure unreproducible and therefore useless.
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  codegen:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      # Only runs where the reference tree is present. Generated code is committed, so the risk is
      # that it stops matching the definitions it claims to come from.
      - name: Check regeneration
        run: |
          if [ -d references/missionplanner ]; then
            cargo run -p xtask -- verify-mavlink all
            cargo run -p xtask -- codegen all --check
          else
            echo "reference tree absent; skipping regeneration check"
          fi

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
