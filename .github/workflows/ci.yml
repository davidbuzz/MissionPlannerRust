name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job has a limit about twice its longest run, so a hang fails within the hour or
    # two rather than at GitHub's six hours: the planner's build script runs a second cargo
    # (the shipped plugins, crates/mp-gui/build.rs), and a wait on a lock would otherwise sit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # gpui's X11 backend needs these to link; a machine that can run X11 software can still
      # fail to link it, because the bare .so symlinks live in the -dev packages.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev libudev-dev libfontconfig1-dev xvfb \
            libclang-dev linux-libc-dev \
            mesa-vulkan-drivers  # lavapipe, the software Vulkan device the smoke step draws with
          # mp-video: v4l2-sys-mit runs bindgen at build time (PLAN §13.6 row 84), hence libclang.
      # The tree is not kept rustfmt-clean (the owner's choice, 2026-10-03: rustfmt on a crate root
      # rewrites every module it declares), so the check reports and does not fail the build.
      - run: cargo fmt --all -- --check
        continue-on-error: true

      - run: cargo clippy --workspace --all-targets
      # --no-fail-fast: every failing test binary in one run - without it the run stops at the
      # first, and a platform's failures came to light one push at a time (2026-10-04).
      - run: cargo test --workspace --no-fail-fast
            # The porting ledger: one row per C# file, every row well-formed. MP_SRC names no C# tree
      # here, so this validates the CSV on its own and says so; a row whose state
      # claims evidence that does not exist still fails.
      - run: cargo xtask ledger check

      # Open a window and paint it, on every platform.
      #
      # This is the only thing in CI that exercises a graphics backend. Everything above compiles
      # the renderer and never runs it, so a backend that will not initialise, a surface it cannot
      # create or a shader that will not compile is invisible - it kills the application at
      # startup on the machine that has the problem and nowhere else. Windows is why this exists:
      # the Direct3D 11 path had never been run at all, because nobody on the project has a
      # Windows machine.
      #
      # MP_SMOKE makes the real binary exit 0 once it has painted three frames and non-zero if it
      # has not painted them within thirty seconds. Tiles are off so the result does not depend on
      # a tile server, and recording is off so a runner does not accumulate .tlog files.
      - name: Build the GUI
        run: cargo build -p mp-gui
      - name: Window opens and paints (Linux)
        if: runner.os == 'Linux'
        # A runner has no display, so one is supplied, and no GPU, so Mesa's lavapipe is named as
        # the Vulkan device, as tools/gui-headless.sh names it: without an ICD the first run
        # (2026-10-03) ended with "Failed to create surface for any enabled backend". Software
        # rendering is slow and entirely sufficient: the question is whether the backend comes up.
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" ./target/debug/planner
      # Named separately from macOS only because of the extension; the runner has a desktop
      # session, and Direct3D 11 falls back to WARP, the software rasteriser, where there is no
      # GPU. WARP still goes through the whole backend - device, swap chain, shaders - which is
      # what is being checked.
      - name: Window opens and paints (Windows)
        if: runner.os == 'Windows'
        env: { MP_SMOKE: "1", MP_NO_TILES: "1", MP_NO_RECORD: "1" }
        run: ./target/debug/planner.exe
      - name: Window opens and paints (macOS)
        if: runner.os == 'macOS'
        env: { MP_SMOKE: "1", MP_NO_TILES: "1", MP_NO_RECORD: "1" }
        run: ./target/debug/planner


  cross-compile:
    name: cross-compile targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # MinGW links the Windows binaries, and libffi's build script compiles libffi with it for
      # this target (Cargo.toml's [patch] for RustPython); libffi uses its bundled configure.
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      # The Windows binaries as README says to cross-compile them from Linux: built and linked, not
      # only checked. This step was a `cargo check` of 13 crates, which generates no code and links
      # nothing; it passed while the real cross-build failed twice on 2026-10-03 - RustPython's
      # MSVC-only time-zone code, a compile error in a crate it did not name, and a missing libffi,
      # a link error no check can find - and it never covered the planner. Debug information is
      # off to keep the target directory inside a hosted runner's disk (with it, 11 GB here).
      - name: Windows binaries
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --target x86_64-pc-windows-gnu
             -p mp-gui --bin planner -p mp-cli --bin headless-planner
      - name: Windows binaries are Windows executables
        run: |
          for exe in planner headless-planner; do
            file target/x86_64-pc-windows-gnu/debug/$exe.exe
            file target/x86_64-pc-windows-gnu/debug/$exe.exe | grep -q "PE32+ executable"
          done

  wasm:
    name: browser build (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # ring's C, under ureq's HTTPS, compiled for wasm32: the runner's clang has the target.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      # The whole planner for a web page (web/README.md), checked as the
      # browser build compiles it: std rebuilt with atomics for gpui_web's threads, which takes
      # nightly features - RUSTC_BOOTSTRAP on the pinned toolchain, as Zed's own CI checks gpui for
      # the web - and getrandom's browser backend. It replaces the check of seven core crates on
      # plain stable, which wasm_thread (the planner's threads, Web Workers in a page) now refuses.
      # A check catches what breaks the browser build: a std call a page cannot make, a crate
      # that does not build there.
      - name: the planner for the web
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals --cfg getrandom_backend="wasm_js"
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo -Zbuild-std=std,panic_abort check --target wasm32-unknown-unknown
             -p mp-gui -p mp-mavlink -p mp-mavlink-dialects -p mp-units -p mp-log
             -p mp-vehicle -p mp-mission -p fencedist

  sitl:
    name: integration against ArduPilot SITL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mp-transport's serial-port crate builds libudev-sys through pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # The SITL binary is committed under tools/sitl, so this needs no ArduPilot checkout.
      # Started as the local suite starts it: start-sitl.sh waits for the simulator to be up and
      # says "sitl ready"; the twenty seconds after are for its estimator to settle before the first
      # test asks for a vehicle, as every local chain waits.
      - name: Start SITL
        run: |
          setsid nohup tools/sitl/start-sitl.sh copter > /tmp/sitl.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q "sitl ready" /tmp/sitl.log && break
            sleep 1
          done
          grep -q "sitl ready" /tmp/sitl.log || { echo "SITL did not start"; cat /tmp/sitl.log; exit 1; }
          sleep 20
      # These are the tests that catch what unit tests cannot: a protocol that stalls because the
      # vehicle answers with a different message than expected, and parameter values that decode
      # to numbers no battery or system id could hold.
            # Serially: SITL serves one TCP client at a time, so tests that each open a link must not
      # overlap. Within a binary that needs --test-threads=1; between binaries cargo already
      # runs sequentially. Only mp-link's ignored tests are SITL's; the workspace's others need a
      # display, a device, the network or a corpus, and are not this job's.
      - run: cargo test -p mp-link -- --ignored --test-threads=1

      # The wrapper's own output is one line naming the simulator's log; the log itself is what
      # says what the vehicle did (a mission upload it still waits for, a timeout), so it is printed
      # too, its last 400 lines.
      - name: SITL log on failure
        if: failure()
        run: |
          cat /tmp/sitl.log
          log=$(grep -oE '/tmp/mp-sitl-[A-Za-z0-9]+\.log' /tmp/sitl.log | tail -1)
          [ -n "$log" ] && { echo "== $log"; tail -400 "$log"; }

  fuzz:
    name: bounded fuzz pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Nightly, because libFuzzer needs it. This is the only job that does, which is why the
      # fuzz crate is excluded from the workspace - an ordinary build must not require it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # mp-transport's serial-port crate builds libudev-sys through pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Bounded rather than the 24 hours Deliverable 2 asks for on frame_parse. A CI job is a regression
      # check: it proves the targets still build and still hold, and it is the long soak that
      # finds new things. frame_parse gets the longest slice because it is the one on the
      # telemetry path, where every byte is attacker-influenced in the sense that matters.
      - name: frame_parse
        run: tools/fuzz.sh frame_parse -max_total_time=180
      - name: frame_stream
        run: tools/fuzz.sh frame_stream -max_total_time=120
      - name: waypoint_file
        run: tools/fuzz.sh waypoint_file -max_total_time=60
      - name: tlog_reader
        run: tools/fuzz.sh tlog_reader -max_total_time=60
      # The one that reaches the per-message decoders, which is 150x more of the codebase than
      # frame_parse reaches - so it gets a slice to match.
      - name: message_decode
        run: tools/fuzz.sh message_decode -max_total_time=180
      # The readers added since: each a bounded slice, the two log readers the longest.
      - name: dataflash_bin
        run: tools/fuzz.sh dataflash_bin -max_total_time=60
      - name: loganalyzer_text
        run: tools/fuzz.sh loganalyzer_text -max_total_time=60
      - name: zip_archive
        run: tools/fuzz.sh zip_archive -max_total_time=30
      - name: fence_file
        run: tools/fuzz.sh fence_file -max_total_time=30
      - name: dbf_table
        run: tools/fuzz.sh dbf_table -max_total_time=30
      - name: intel_hex
        run: tools/fuzz.sh intel_hex -max_total_time=30
      - name: catalogue_text
        run: tools/fuzz.sh catalogue_text -max_total_time=30
      - name: dronecan_slcan
        run: tools/fuzz.sh dronecan_slcan -max_total_time=60
      # A crash leaves its input behind; without this the job fails and the input that caused it
      # is gone, which makes the failure unreproducible and therefore useless.
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  codegen:
    name: generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
                  # Only runs where MP_SRC names a clone of https://github.com/ArduPilot/MissionPlanner.
      # Generated code is committed, so the risk is that it stops matching the definitions it
      # claims to come from.
      - name: Check regeneration
        run: |
          if [ -n "${MP_SRC:-}" ] && [ -d "$MP_SRC" ]; then

            cargo run -p xtask -- verify-mavlink all
            cargo run -p xtask -- codegen all --check
          else
            echo "reference tree absent; skipping regeneration check"
          fi

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
