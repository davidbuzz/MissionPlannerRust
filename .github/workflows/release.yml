name: release builds

# The release planner for Linux, Windows and macOS, built natively from one commit, opened and
# painted once, packaged with the licence files, and kept as this run's artifacts for the owner to
# publish. The planner alone: headless-planner is an internal testing tool, not part of the
# application. The owner's borrowed Mac builds the same commit by hand as a check (DEV_MACOS.md).
# Run by hand (Actions > release builds > Run workflow), or by pushing a release tag - "v" and a
# number, v0_1 or v1.2.0 - which builds that tag's commit and then publishes the three downloads,
# their checksums and the release notes as the tag's GitHub release (the `publish` job).
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86-64, glibc 2.35)
    # 22.04, not the newest: a binary needs the glibc it was built against or newer, and 22.04's
    # 2.35 runs on 22.04 and 24.04 alike, where a 24.04 build needs 2.39 (tools/package.sh says so).
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # A release build with the profile's debug information is larger than the runner's free
      # disk; the preinstalled .NET, Android and Haskell toolchains are not needed here.
      - name: Room for a release build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev libudev-dev libfontconfig1-dev libclang-dev \
            linux-libc-dev fakeroot xvfb mesa-vulkan-drivers
      - name: Build, strip and package (tools/package.sh deb)
        run: tools/package.sh deb
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        # Lavapipe, Mesa's software Vulkan device, draws it, as in CI. 22.04's Mesa (23.2) names its
        # driver file for the architecture, lvp_icd.x86_64.json, where 24.04's and newer name it
        # lvp_icd.json; naming the latter here, the v0_0_0 run (2026-10-04) built and packaged the
        # planner and then stopped on "Failed to create surface for any enabled backend". Found by
        # pattern, so either spelling serves.
        run: |
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          [ -f "$VK_ICD_FILENAMES" ] || { echo "no lavapipe driver file in /usr/share/vulkan/icd.d"; exit 1; }
          echo "lavapipe: $VK_ICD_FILENAMES"
          export VK_ICD_FILENAMES
          xvfb-run -a --server-args="-screen 0 1600x1200x24" dist/planner
      - name: Archive
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "$GITHUB_REF_TYPE" = tag ] && V=${GITHUB_REF_NAME#v}
          N=missionplanner-rust_${V}_linux-x86_64
          mkdir -p release/$N
          cp dist/planner LICENSE NOTICE THIRD_PARTY_LICENSES README.md release/$N/
          {
            echo "MissionPlannerRust $V for Linux on x86-64"
            echo
            echo "Source:  https://github.com/${GITHUB_REPOSITORY}"
            echo "Commit:  ${GITHUB_SHA}"
            echo "Built:   $(date -u +%Y-%m-%d) on $(. /etc/os-release && echo "$PRETTY_NAME"), $(rustc --version)"
            echo "Command: tools/package.sh deb (cargo build --release, then strip)"
            echo "Needs:   $(objdump -T dist/planner | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1) or newer, a Vulkan driver (mesa-vulkan-drivers)"
            echo
            echo "planner  the ground control station"
            echo
            echo "Licensed under the GNU GPL version 3 (LICENSE); NOTICE and THIRD_PARTY_LICENSES"
            echo "record what it derives from and what it is built from."
          } > release/$N/BUILD-INFO.txt
          tar -C release -czf release/$N.tar.gz $N
          cp dist/*.deb release/
          (cd release && sha256sum *.tar.gz *.deb | tee SHA256SUMS-linux)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.tar.gz
            release/*.deb
            release/SHA256SUMS-linux

  windows:
    name: Windows (x86-64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # The C runtime linked in, so that the binaries need no Visual C++ Redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p mp-gui --bin planner
      - name: The DLLs it imports (system ones only)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          & $dumpbin.FullName /dependents "target\release\planner.exe" | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        run: ./target/release/planner.exe
      - name: Archive
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          $n = "missionplanner-rust_${v}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "release\$n" | Out-Null
          Copy-Item target\release\planner.exe, LICENSE, NOTICE, THIRD_PARTY_LICENSES, README.md "release\$n\"
          @(
            "MissionPlannerRust $v for Windows on x86-64",
            "",
            "Source:  https://github.com/$env:GITHUB_REPOSITORY",
            "Commit:  $env:GITHUB_SHA",
            "Built:   $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')) on windows-latest, $(rustc --version)",
            "Command: cargo build --release -p mp-gui --bin planner",
            "         with the C runtime linked in (+crt-static): no Visual C++ Redistributable needed",
            "",
            "planner.exe  the ground control station",
            "",
            "Unsigned: Windows SmartScreen may ask before the first start.",
            "Licensed under the GNU GPL version 3 (LICENSE); NOTICE and THIRD_PARTY_LICENSES",
            "record what it derives from and what it is built from."
          ) | Set-Content "release\$n\BUILD-INFO.txt"
          Compress-Archive -Path "release\$n" -DestinationPath "release\$n.zip"
          $h = (Get-FileHash "release\$n.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $n.zip" | Tee-Object -FilePath release\SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.zip
            release/SHA256SUMS-windows

  macos:
    name: macOS (universal, arm64 + x86-64)
    # Apple Silicon builds both architectures and lipo joins them: one planner for every Mac.
    # GitHub's Intel images are being retired, and Apple's toolchain cross-compiles either way.
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      # liblzma-sys takes Homebrew's xz through pkg-config when it is there, and the runner has it;
      # built in, the planner links nothing outside macOS (DEV_MACOS.md).
      LZMA_API_STATIC: "1"
      # The shipped binary is stripped, so debug information changes nothing shipped, and it is
      # most of a fat-LTO link's memory on a 7 GB runner.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Both architectures' standard libraries
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build for Apple Silicon
        run: cargo build --release -p mp-gui --bin planner --target aarch64-apple-darwin
      - name: Build for Intel
        run: cargo build --release -p mp-gui --bin planner --target x86_64-apple-darwin
      - name: One universal planner, stripped
        run: |
          mkdir -p dist
          lipo -create -output dist/planner \
            target/aarch64-apple-darwin/release/planner target/x86_64-apple-darwin/release/planner
          strip dist/planner
          lipo -info dist/planner
          file dist/planner
      - name: It links macOS alone
        run: |
          otool -L dist/planner
          if otool -L dist/planner | grep -E '/opt/homebrew|/usr/local'; then
            echo "the planner links a library outside macOS"; exit 1
          fi
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        run: dist/planner
      - name: Archive
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "$GITHUB_REF_TYPE" = tag ] && V=${GITHUB_REF_NAME#v}
          N=missionplanner-rust_${V}_macos-universal
          mkdir -p release/$N
          cp dist/planner LICENSE NOTICE THIRD_PARTY_LICENSES README.md release/$N/
          {
            echo "MissionPlannerRust $V for macOS, universal (Apple Silicon and Intel)"
            echo
            echo "Source:   https://github.com/${GITHUB_REPOSITORY}"
            echo "Commit:   ${GITHUB_SHA}"
            echo "Built:    $(date -u +%Y-%m-%d) on macOS $(sw_vers -productVersion), $(rustc --version)"
            echo "Command:  LZMA_API_STATIC=1 cargo build --release -p mp-gui --bin planner, once per"
            echo "          architecture (aarch64-apple-darwin, x86_64-apple-darwin), joined by lipo,"
            echo "          then strip; DEV_MACOS.md in the source describes the process"
            echo "Links:    macOS's own frameworks and /usr/lib only (no Homebrew library)"
            echo "Plugins:  the ten plugins Mission Planner ships are built into the planner"
            echo
            echo "planner  the ground control station"
            echo
            echo "Unsigned and not notarised: macOS will hold the first launch until it is allowed in"
            echo "System Settings > Privacy & Security. Licensed under the GNU GPL version 3 (LICENSE);"
            echo "NOTICE and THIRD_PARTY_LICENSES record what it derives from and what it is built from."
          } > release/$N/BUILD-INFO.txt
          tar -C release -czf release/$N.tar.gz $N
          (cd release && shasum -a 256 $N.tar.gz | tee SHA256SUMS-macos)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.tar.gz
            release/SHA256SUMS-macos

  publish:
    name: GitHub release
    # Only for a release tag, and only once all three platforms have built, opened and packaged.
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd assets
          cat SHA256SUMS-linux SHA256SUMS-windows SHA256SUMS-macos > SHA256SUMS.txt
          rm SHA256SUMS-linux SHA256SUMS-windows SHA256SUMS-macos
          ls -la
          linux=$(ls *_linux-x86_64.tar.gz); deb=$(ls *.deb); windows=$(ls *_windows-x86_64.zip); macos=$(ls *_macos-universal.tar.gz)
          {
            echo "MissionPlannerRust ${GITHUB_REF_NAME}: Mission Planner, the ground control station for ArduPilot, in Rust."
            echo
            echo "Built from commit ${GITHUB_SHA} by this repository's release workflow. Each planner below"
            echo "was opened and painted once on its own platform before it was packaged."
            echo
            echo "| Download | For |"
            echo "|---|---|"
            echo "| \`$linux\` | Linux on x86-64 with glibc 2.35 or newer (Ubuntu 22.04 and later) |"
            echo "| \`$deb\` | Debian and Ubuntu: \`sudo apt install ./$deb\` |"
            echo "| \`$windows\` | Windows 10 and 11 on x86-64 |"
            echo "| \`$macos\` | macOS on Apple Silicon and Intel (one universal binary) |"
            echo
            echo "Each archive holds the planner, its licence, NOTICE, THIRD_PARTY_LICENSES and a BUILD-INFO.txt"
            echo "naming the commit and the toolchain; SHA256SUMS.txt lists every download's SHA-256."
            echo
            echo "The binaries are not signed. Windows SmartScreen asks before the first start; on macOS, allow"
            echo "it in System Settings > Privacy & Security after the first attempt. On Linux the planner draws"
            echo "with Vulkan, so a Vulkan driver is needed (mesa-vulkan-drivers)."
            echo
            echo "MissionPlannerRust is derived from Mission Planner (https://github.com/ArduPilot/MissionPlanner)"
            echo "and licensed under the GNU General Public License version 3; its source is this repository at"
            echo "${GITHUB_REF_NAME}."
          } > ../notes.md
          cat ../notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file ../notes.md
          else
            gh release create "$GITHUB_REF_NAME" * --title "MissionPlannerRust $GITHUB_REF_NAME" \
              --notes-file ../notes.md --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME" --json url,assets --jq '.url, (.assets[] | "  " + .name)'
