name: release builds

# The release planner for Linux, Windows and macOS, built natively from one commit, opened and
# painted once, packaged with the licence files, and kept as this run's artifacts for the owner to
# publish. The planner alone: headless-planner is an internal testing tool, not part of the
# application. The owner's borrowed Mac builds the same commit by hand as a check (DEV_MACOS.md).
# Run by hand (Actions > release builds > Run workflow), or by pushing a release tag - "v" and a
# number, v0_0_2 - which builds that tag's commit and then publishes the three downloads,
# their checksums and the release notes as the tag's GitHub release (the `publish` job).
#
# The planner's own update reads what this publishes (updates.md): each build is told what it is -
# its version, channel and commit, which `planner --version` prints - and `publish` writes
# update.json beside the downloads, the manifest the planner fetches. A tag "v" and numbers is the
# stable channel's release. The beta channel's is one rolling pre-release named "beta", made when
# the owner runs this workflow by hand with the channel "beta": it builds the head of main, and
# needs no tag from him (the owner, 2026-11-18: "pls make beta builds *not* need any sort of tag,
# they should just build 'head'"). The `what` job (tools/release/what.sh) decides which of these
# a run is.
#
# NOTHING HERE RELEASES BY ITSELF, and nothing may be added that does (the owner, 2026-11-18: "DO
# NOT DO ANY FORM OF AUTOMATED RELEASE, EVER. this is DENIED. user must always action it."). There
# is no schedule: a release starts when he pushes its tag, a beta when he runs the workflow.
#
# The beta's pre-release is asked of GitHub once, by name alone, before anything is built (the
# `what` job), and every beta after puts its files in that same pre-release. GitHub keeps a tag
# of that name for it - it holds no release without one - which it makes itself and nobody moves.
# No commit is named to GitHub: the first beta run (44249073440, 2026-11-18) asked for a release
# at a commit (`--target`) after an hour of building, and was refused twice, "HTTP 403: Resource
# not accessible by integration", the second time with a tag already pushed. Asked first, a
# refusal costs a minute and not the three builds.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "beta builds the head of main as the beta channel's; none keeps the build as this run's artifacts"
        type: choice
        options: [none, beta]
        default: none
  push:
    tags: ['v[0-9]*']

env:
  CARGO_TERM_COLOR: always

jobs:
  what:
    name: What this run builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Write only for the beta's pre-release, asked for below.
      contents: write
    outputs:
      build: ${{ steps.what.outputs.build }}
      channel: ${{ steps.what.outputs.channel }}
      version: ${{ steps.what.outputs.version }}
      label: ${{ steps.what.outputs.label }}
      deb: ${{ steps.what.outputs.deb }}
      tag: ${{ steps.what.outputs.tag }}
      built: ${{ steps.what.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag: a beta carries the version of the last release before it.
          fetch-depth: 0
      - id: what
        env:
          WANTED: ${{ inputs.channel }}
        run: tools/release/what.sh >> "$GITHUB_OUTPUT"
      - name: The beta's place on GitHub, asked for before anything is built
        # A pre-release named "beta", made the first time and kept: each beta's files replace the
        # last one's in it (the `publish` job). If GitHub refuses, the run stops here.
        if: steps.what.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view beta > /dev/null 2>&1; then
            echo "the beta pre-release is there"
          else
            gh release create beta --prerelease --title "MissionPlannerRust beta" \
              --notes "A beta is being built: its downloads follow once all three planners have built."
          fi

  linux:
    name: Linux (x86-64, glibc 2.35)
    # 22.04, not the newest: a binary needs the glibc it was built against or newer, and 22.04's
    # 2.35 runs on 22.04 and 24.04 alike, where a 24.04 build needs 2.39 (tools/package.sh says so).
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    needs: what
    if: needs.what.outputs.build == 'true'
    env:
      # What the build is, compiled in (crates/mp-update/src/identity.rs): empty for a build by
      # hand, which calls itself a development build and is never updated from a release.
      MP_RELEASE_VERSION: ${{ needs.what.outputs.version }}
      MP_RELEASE_CHANNEL: ${{ needs.what.outputs.channel }}
      MP_RELEASE_COMMIT: ${{ github.sha }}
      MP_RELEASE_BUILT: ${{ needs.what.outputs.built }}
      MP_RELEASE_LABEL: ${{ needs.what.outputs.label }}
      # The Debian package's version, which may hold no underscore (tools/package.sh).
      MP_RELEASE_DEB: ${{ needs.what.outputs.deb }}
    steps:
      - uses: actions/checkout@v4
      # A release build with the profile's debug information is larger than the runner's free
      # disk; the preinstalled .NET, Android and Haskell toolchains are not needed here.
      - name: Room for a release build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libasound2-dev libudev-dev libfontconfig1-dev libclang-dev \
            linux-libc-dev fakeroot xvfb mesa-vulkan-drivers
      - name: Build, strip and package (tools/package.sh deb)
        run: tools/package.sh deb
      - name: It says what it is
        if: needs.what.outputs.channel != ''
        run: |
          dist/planner --version | tee version.txt
          grep -F "planner $MP_RELEASE_VERSION ($MP_RELEASE_CHANNEL, commit ${GITHUB_SHA:0:12}" version.txt
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        # Lavapipe, Mesa's software Vulkan device, draws it, as in CI. 22.04's Mesa (23.2) names its
        # driver file for the architecture, lvp_icd.x86_64.json, where 24.04's and newer name it
        # lvp_icd.json; naming the latter here, the v0_0_0 run (2026-10-04) built and packaged the
        # planner and then stopped on "Failed to create surface for any enabled backend". Found by
        # pattern, so either spelling serves.
        run: |
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          [ -f "$VK_ICD_FILENAMES" ] || { echo "no lavapipe driver file in /usr/share/vulkan/icd.d"; exit 1; }
          echo "lavapipe: $VK_ICD_FILENAMES"
          export VK_ICD_FILENAMES
          xvfb-run -a --server-args="-screen 0 1600x1200x24" dist/planner
      - name: Archive
        run: |
          V=${MP_RELEASE_LABEL:-$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')}
          N=missionplanner-rust_${V}_linux-x86_64
          mkdir -p release/$N
          cp dist/planner LICENSE NOTICE THIRD_PARTY_LICENSES README.md release/$N/
          # SIMULATION's "try local wasm": ArduPilot's SITL as WebAssembly, run under Node.
          cp -r tools/sitl/wasm release/$N/sitl-wasm
          {
            echo "MissionPlannerRust $V for Linux on x86-64"
            echo
            echo "Source:  https://github.com/${GITHUB_REPOSITORY}"
            echo "Commit:  ${GITHUB_SHA}"
            echo "Built:   $(date -u +%Y-%m-%d) on $(. /etc/os-release && echo "$PRETTY_NAME"), $(rustc --version)"
            echo "Command: tools/package.sh deb (cargo build --release, then strip)"
            echo "Needs:   $(objdump -T dist/planner | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1) or newer, a Vulkan driver (mesa-vulkan-drivers)"
            echo
            echo "planner  the ground control station"
            echo "sitl-wasm  ArduPilot's SITL (plane, rover, copter, heli) as WebAssembly, for SIMULATION's"
            echo "           'try local wasm'; needs Node.js (nodejs.org). sitl-wasm/README.md says where from"
            echo
            echo "Licensed under the GNU GPL version 3 (LICENSE); NOTICE and THIRD_PARTY_LICENSES"
            echo "record what it derives from and what it is built from."
          } > release/$N/BUILD-INFO.txt
          tar -C release -czf release/$N.tar.gz $N
          cp dist/*.deb release/
          (cd release && sha256sum *.tar.gz *.deb | tee SHA256SUMS-linux)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.tar.gz
            release/*.deb
            release/SHA256SUMS-linux

  windows:
    name: Windows (x86-64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 150
    needs: what
    if: needs.what.outputs.build == 'true'
    env:
      # What the build is, compiled in (crates/mp-update/src/identity.rs): empty for a build by
      # hand, which calls itself a development build and is never updated from a release.
      MP_RELEASE_VERSION: ${{ needs.what.outputs.version }}
      MP_RELEASE_CHANNEL: ${{ needs.what.outputs.channel }}
      MP_RELEASE_COMMIT: ${{ github.sha }}
      MP_RELEASE_BUILT: ${{ needs.what.outputs.built }}
      MP_RELEASE_LABEL: ${{ needs.what.outputs.label }}
      # The C runtime linked in, so that the binaries need no Visual C++ Redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p mp-gui --bin planner
      - name: It says what it is
        if: needs.what.outputs.channel != ''
        shell: pwsh
        run: |
          $said = (& .\target\release\planner.exe --version | Out-String).Trim()
          $said
          $wanted = "planner $env:MP_RELEASE_VERSION ($env:MP_RELEASE_CHANNEL, commit $($env:GITHUB_SHA.Substring(0, 12))"
          if (-not $said.Contains($wanted)) { Write-Error "wanted: $wanted"; exit 1 }
      - name: The DLLs it imports (system ones only)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          & $dumpbin.FullName /dependents "target\release\planner.exe" | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        run: ./target/release/planner.exe
      - name: Archive
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:MP_RELEASE_LABEL) { $v = $env:MP_RELEASE_LABEL }
          $n = "missionplanner-rust_${v}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "release\$n" | Out-Null
          Copy-Item target\release\planner.exe, LICENSE, NOTICE, THIRD_PARTY_LICENSES, README.md "release\$n\"
          # SIMULATION's "try local wasm": ArduPilot's SITL as WebAssembly, run under Node.
          Copy-Item -Recurse tools\sitl\wasm "release\$n\sitl-wasm"
          @(
            "MissionPlannerRust $v for Windows on x86-64",
            "",
            "Source:  https://github.com/$env:GITHUB_REPOSITORY",
            "Commit:  $env:GITHUB_SHA",
            "Built:   $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')) on windows-latest, $(rustc --version)",
            "Command: cargo build --release -p mp-gui --bin planner",
            "         with the C runtime linked in (+crt-static): no Visual C++ Redistributable needed",
            "",
            "planner.exe  the ground control station",
            "sitl-wasm    ArduPilot's SITL (plane, rover, copter, heli) as WebAssembly, for SIMULATION's",
            "             'try local wasm'; needs Node.js (nodejs.org). sitl-wasm\README.md says where from",
            "",
            "Unsigned: Windows SmartScreen may ask before the first start.",
            "Licensed under the GNU GPL version 3 (LICENSE); NOTICE and THIRD_PARTY_LICENSES",
            "record what it derives from and what it is built from."
          ) | Set-Content "release\$n\BUILD-INFO.txt"
          Compress-Archive -Path "release\$n" -DestinationPath "release\$n.zip"
          $h = (Get-FileHash "release\$n.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $n.zip" | Tee-Object -FilePath release\SHA256SUMS-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.zip
            release/SHA256SUMS-windows

  macos:
    name: macOS (universal, arm64 + x86-64)
    # Apple Silicon builds both architectures and lipo joins them: one planner for every Mac.
    # GitHub's Intel images are being retired, and Apple's toolchain cross-compiles either way.
    runs-on: macos-latest
    timeout-minutes: 180
    needs: what
    if: needs.what.outputs.build == 'true'
    env:
      # What the build is, compiled in (crates/mp-update/src/identity.rs): empty for a build by
      # hand, which calls itself a development build and is never updated from a release.
      MP_RELEASE_VERSION: ${{ needs.what.outputs.version }}
      MP_RELEASE_CHANNEL: ${{ needs.what.outputs.channel }}
      MP_RELEASE_COMMIT: ${{ github.sha }}
      MP_RELEASE_BUILT: ${{ needs.what.outputs.built }}
      MP_RELEASE_LABEL: ${{ needs.what.outputs.label }}
      # liblzma-sys takes Homebrew's xz through pkg-config when it is there, and the runner has it;
      # built in, the planner links nothing outside macOS (DEV_MACOS.md).
      LZMA_API_STATIC: "1"
      # The shipped binary is stripped, so debug information changes nothing shipped, and it is
      # most of a fat-LTO link's memory on a 7 GB runner.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Both architectures' standard libraries
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build for Apple Silicon
        run: cargo build --release -p mp-gui --bin planner --target aarch64-apple-darwin
      - name: Build for Intel
        run: cargo build --release -p mp-gui --bin planner --target x86_64-apple-darwin
      - name: One universal planner, stripped
        run: |
          mkdir -p dist
          lipo -create -output dist/planner \
            target/aarch64-apple-darwin/release/planner target/x86_64-apple-darwin/release/planner
          strip dist/planner
          lipo -info dist/planner
          file dist/planner
      - name: It says what it is
        if: needs.what.outputs.channel != ''
        run: |
          dist/planner --version | tee version.txt
          grep -F "planner $MP_RELEASE_VERSION ($MP_RELEASE_CHANNEL, commit ${GITHUB_SHA:0:12}" version.txt
      - name: It links macOS alone
        run: |
          otool -L dist/planner
          if otool -L dist/planner | grep -E '/opt/homebrew|/usr/local'; then
            echo "the planner links a library outside macOS"; exit 1
          fi
      - name: The release planner opens and paints
        env:
          MP_SMOKE: "1"
          MP_NO_TILES: "1"
          MP_NO_RECORD: "1"
        run: dist/planner
      - name: Archive
        run: |
          V=${MP_RELEASE_LABEL:-$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')}
          N=missionplanner-rust_${V}_macos-universal
          mkdir -p release/$N
          cp dist/planner LICENSE NOTICE THIRD_PARTY_LICENSES README.md release/$N/
          # SIMULATION's "try local wasm": ArduPilot's SITL as WebAssembly, run under Node.
          cp -r tools/sitl/wasm release/$N/sitl-wasm
          {
            echo "MissionPlannerRust $V for macOS, universal (Apple Silicon and Intel)"
            echo
            echo "Source:   https://github.com/${GITHUB_REPOSITORY}"
            echo "Commit:   ${GITHUB_SHA}"
            echo "Built:    $(date -u +%Y-%m-%d) on macOS $(sw_vers -productVersion), $(rustc --version)"
            echo "Command:  LZMA_API_STATIC=1 cargo build --release -p mp-gui --bin planner, once per"
            echo "          architecture (aarch64-apple-darwin, x86_64-apple-darwin), joined by lipo,"
            echo "          then strip; DEV_MACOS.md in the source describes the process"
            echo "Links:    macOS's own frameworks and /usr/lib only (no Homebrew library)"
            echo "Plugins:  the ten plugins Mission Planner ships are built into the planner"
            echo
            echo "planner  the ground control station"
            echo "sitl-wasm  ArduPilot's SITL (plane, rover, copter, heli) as WebAssembly, for SIMULATION's"
            echo "           'try local wasm'; needs Node.js (nodejs.org). sitl-wasm/README.md says where from"
            echo
            echo "Unsigned and not notarised: macOS will hold the first launch until it is allowed in"
            echo "System Settings > Privacy & Security. Licensed under the GNU GPL version 3 (LICENSE);"
            echo "NOTICE and THIRD_PARTY_LICENSES record what it derives from and what it is built from."
          } > release/$N/BUILD-INFO.txt
          tar -C release -czf release/$N.tar.gz $N
          (cd release && shasum -a 256 $N.tar.gz | tee SHA256SUMS-macos)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.tar.gz
            release/SHA256SUMS-macos

  publish:
    name: GitHub release
    # Only for a release - a tag's, or the beta - and only once all three platforms have built,
    # opened and packaged.
    if: needs.what.outputs.channel != ''
    needs: [what, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.what.outputs.channel }}
      VERSION: ${{ needs.what.outputs.version }}
      TAG: ${{ needs.what.outputs.tag }}
      BUILT: ${{ needs.what.outputs.built }}
    steps:
      # For tools/release, and every tag: the notes compare this release with the one before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          # Not "assets": the repository has a folder of that name, and since this job checks the
          # repository out the downloads landed among its files - the beta run of 2026-11-18
          # (44259800782) uploaded one of them and stopped at the first folder, "read geoid: is a
          # directory".
          path: release-files
          merge-multiple: true
      - name: What changed since the last release (tools/release/notes.py)
        # Nobody writes the notes: the advisories fixed are those against what the last release
        # was built from and not against this one, asked of the OSV database, and the dependency
        # changes are the two Cargo.lock files' difference (the owner, 2026-11-18).
        run: |
          if [ "$CHANNEL" = beta ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^")
          fi
          git show "$previous:Cargo.lock" > old.lock
          python3 tools/release/notes.py section --tag "$TAG" --previous "$previous" \
            --commit "$GITHUB_SHA" --date "${BUILT%%T*}" --old-lock old.lock --new-lock Cargo.lock \
            --out section.md
          # RELEASE_NOTES.md as a download: main's, with this release at its head; the beta's is
          # its own section alone, since only a tagged release is kept in the file.
          if [ "$CHANNEL" = beta ]; then
            cp section.md release-files/RELEASE_NOTES.md
          else
            git show origin/main:RELEASE_NOTES.md > release-files/RELEASE_NOTES.md 2>/dev/null || rm -f release-files/RELEASE_NOTES.md
            python3 tools/release/notes.py prepend --file release-files/RELEASE_NOTES.md --section section.md --tag "$TAG"
          fi
      - name: Checksums and release notes
        run: |
          cd release-files
          cat SHA256SUMS-linux SHA256SUMS-windows SHA256SUMS-macos > SHA256SUMS.txt
          rm SHA256SUMS-linux SHA256SUMS-windows SHA256SUMS-macos
          ls -la
          linux=$(ls *_linux-x86_64.tar.gz); deb=$(ls *.deb); windows=$(ls *_windows-x86_64.zip); macos=$(ls *_macos-universal.tar.gz)
          {
            # What changed, computed (the step above), before what the downloads are.
            cat ../section.md
            echo
            if [ "$CHANNEL" = beta ]; then
              echo "MissionPlannerRust beta: main as of ${GITHUB_SHA:0:12}, after release ${VERSION}. Replaced by the next beta."
              echo "HELP > Check for BETA Updates takes a planner to it; the releases are the tagged ones."
            else
              echo "MissionPlannerRust ${TAG}: Mission Planner, the ground control station for ArduPilot, in Rust."
            fi
            echo
            echo "Built from commit ${GITHUB_SHA} by this repository's release workflow. Each planner below"
            echo "was opened and painted once on its own platform before it was packaged."
            echo
            echo "| Download | For |"
            echo "|---|---|"
            echo "| \`$linux\` | Linux on x86-64 with glibc 2.35 or newer (Ubuntu 22.04 and later) |"
            echo "| \`$deb\` | Debian and Ubuntu: \`sudo apt install ./$deb\` |"
            echo "| \`$windows\` | Windows 10 and 11 on x86-64 |"
            echo "| \`$macos\` | macOS on Apple Silicon and Intel (one universal binary) |"
            echo
            echo "Each archive holds the planner, its licence, NOTICE, THIRD_PARTY_LICENSES and a BUILD-INFO.txt"
            echo "naming the commit and the toolchain; SHA256SUMS.txt lists every download's SHA-256."
            echo
            echo "Each also holds \`sitl-wasm\`, ArduPilot's SITL built as WebAssembly (plane, rover, copter, heli),"
            echo "which the SIMULATION screen's \"try local wasm\" box starts - ticked by default on macOS, where"
            echo "ArduPilot publishes no native SITL. It needs Node.js (https://nodejs.org), found on PATH or named"
            echo "by MP_NODE; nothing else of the planner does."
            echo
            echo "The binaries are not signed. Windows SmartScreen asks before the first start; on macOS, allow"
            echo "it in System Settings > Privacy & Security after the first attempt. On Linux the planner draws"
            echo "with Vulkan, so a Vulkan driver is needed (mesa-vulkan-drivers)."
            echo
            echo "MissionPlannerRust is derived from Mission Planner (https://github.com/ArduPilot/MissionPlanner)"
            echo "and licensed under the GNU General Public License version 3; its source is this repository at"
            echo "${TAG} (commit ${GITHUB_SHA})."
            echo
            echo "update.json is the manifest the planner's own update reads (updates.md)."
          } > ../notes.md
          cat ../notes.md
      - name: Publish, the manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-files
          # update.json, from the downloads as they are here: a planner that reads it is sent to
          # files of exactly these sizes and hashes, so it goes up after them, never before.
          # What is published, by name: the four downloads, their checksums and the notes. Never
          # "everything in this folder".
          set -- *_linux-x86_64.tar.gz *_amd64.deb *_windows-x86_64.zip *_macos-universal.tar.gz \
            SHA256SUMS.txt RELEASE_NOTES.md
          for file in "$@"; do
            [ -f "$file" ] || { echo "not a file to publish: $file"; exit 1; }
          done
          [ $# -eq 6 ] || { echo "expected six files to publish, found $#: $*"; exit 1; }
          python3 ../tools/release/manifest.py write --channel "$CHANNEL" --tag "$TAG" \
            --version "$VERSION" --commit "$GITHUB_SHA" --built "$BUILT" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --dir . --out ../update.json
          if [ "$CHANNEL" = beta ]; then
            # One rolling pre-release, there since the `what` job: this beta's downloads beside
            # the last one's (their names carry the commit), then the manifest, then the last
            # one's removed. No tag is made or moved and no commit named.
            old=$(gh release view beta --json assets --jq '.assets[].name')
            gh release upload beta "$@" --clobber
            gh release upload beta ../update.json --clobber
            gh release edit beta --prerelease --notes-file ../notes.md
            for name in $old; do
              [ -e "$name" ] || [ "$name" = update.json ] || gh release delete-asset beta "$name" --yes
            done
          else
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$@" --clobber
              gh release edit "$TAG" --notes-file ../notes.md
            else
              gh release create "$TAG" "$@" --title "MissionPlannerRust $TAG" \
                --notes-file ../notes.md --verify-tag --latest
            fi
            gh release upload "$TAG" ../update.json --clobber
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  " + .name)'
      - name: The published release is what the manifest says
        # As a planner would fetch it: the manifest by its public address, then every download it
        # names, each held to its size and SHA-256.
        run: |
          sleep 15
          python3 tools/release/manifest.py verify "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/update.json"
      - name: RELEASE_NOTES.md on main (a tagged release)
        # The file in the repository is the workflow's too: this release's section put at its
        # head and committed. Pushed with the workflow's own token, which starts no other
        # workflow. It is part of the release the owner started, not a release of its own.
        if: needs.what.outputs.channel == 'stable'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            python3 tools/release/notes.py prepend --file RELEASE_NOTES.md --section section.md --tag "$TAG"
            git add RELEASE_NOTES.md
            if git diff --cached --quiet; then echo "RELEASE_NOTES.md already holds $TAG"; exit 0; fi
            git commit -q -m "RELEASE_NOTES.md: $TAG, written by the release workflow (tools/release/notes.py)"
            if git push -q origin main; then git log --oneline -1; exit 0; fi
            echo "main moved while this was pushed: again"; sleep 5
          done
          echo "RELEASE_NOTES.md could not be pushed to main"; exit 1
