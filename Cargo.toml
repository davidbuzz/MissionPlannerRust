[workspace]
resolver = "3"
# `experiments/*` are spikes the owner asked for, in the workspace so they build and test with it:
# the WebAssembly plugin host (PLAN.md §13.6 row 95, §12 D22). `crates/mp-plugin-host/plugins` is
# the real host's plugins (row 96), a member so they type-check and test natively.
members = ["crates/*", "crates/mp-plugin-host/plugins", "xtask", "experiments/wasm-plugin-host/host", "experiments/wasm-plugin-host/plugin"]
# `fuzz` is deliberately excluded: it needs a nightly toolchain and cargo-fuzz, and a normal
# `cargo build --workspace` must not require either.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/davidbuzz/MissionPlannerRust"
authors = ["Mission Planner Rust contributors"]

[workspace.dependencies]
regex = "1.13"
sha1_smol = "1.0"
mp-units = { path = "crates/mp-units" }
mp-settings = { path = "crates/mp-settings" }
mp-vehicle = { path = "crates/mp-vehicle" }
mp-link = { path = "crates/mp-link" }
mp-mission = { path = "crates/mp-mission" }
mp-params = { path = "crates/mp-params" }
mp-calibration = { path = "crates/mp-calibration" }
mp-ftp = { path = "crates/mp-ftp" }
mp-log = { path = "crates/mp-log" }
mp-mavlink = { path = "crates/mp-mavlink" }
mp-mavlink-dialects = { path = "crates/mp-mavlink-dialects" }
mp-transport = { path = "crates/mp-transport" }
mp-tiles = { path = "crates/mp-tiles" }
mp-input = { path = "crates/mp-input" }
mp-firmware = { path = "crates/mp-firmware" }
mp-kml = { path = "crates/mp-kml" }
mp-terrain = { path = "crates/mp-terrain" }
mp-georef = { path = "crates/mp-georef" }
mp-chart = { path = "crates/mp-chart" }
mp-script = { path = "crates/mp-script" }
mp-video = { path = "crates/mp-video" }
mp-plugin-host = { path = "crates/mp-plugin-host" }
mp-dronecan = { path = "crates/mp-dronecan" }
mp-sikradio = { path = "crates/mp-sikradio" }
mp-update = { path = "crates/mp-update" }
thiserror = "2"
sha2 = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
roxmltree = "0.20"
# The signing keys' store, `authkeys.xml`: `Crypto.cs`'s Rijndael - AES-256, CBC, PKCS7. The
# versions gpui's keyring (oo7) already compiles on Linux.
aes = "0.8"
cbc = "0.1"
# The planner's Text entry reads glyph outlines from the font file (GDI+'s AddString stand-in).
ttf-parser = "0.25"
# The firmware container: JSON wrapping a base64 zlib stream. Pinned to what the tree already
# resolves, so they cost no extra compilation.
serde_json = "1"
base64 = "0.22"
flate2 = "1"
# Local time only. Pinned to what gpui already pulls in, so it costs nothing to compile.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
# `MagCalib.cs`'s fit, where the C# has alglib's `minlmcreatev` (PLAN.md §3's numerics row).
# nalgebra at the version the solver is built against, 0.34: its matrices are the solver's
# interface, so a second nalgebra would not do.
levenberg-marquardt = "0.15"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
# Tile fetching. Blocking and small: the tile thread is a dedicated thread that is allowed to
# block, exactly like the link's I/O thread, so an async runtime would be machinery with no user.
# rustls rather than the system TLS, so a Windows build needs no extra toolchain and a Linux one
# needs no OpenSSL headers.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Tile decoding. Only the two formats raster providers actually serve; the rest of the crate's
# decoders are attack surface for a ground station that will be pointed at arbitrary URLs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Localisation (D17): the screens' words from the .ftl files `cargo xtask codegen-resx` writes
# from Mission Planner's .resx. Already in the tree for xtask's own tests.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
# D14's FFT: the log FFT window's transform (`ExtLibs/Utilities/fft.cs`'s `FFT2`). PLAN.md's
# numerics row pins it.
rustfft = "6.4.1"
# The log browser's field descriptions: autotest's LogMessages.xml.xz, which LogMetaData.cs
# unpacks with SharpCompress's XZStream. Pure Rust, so no liblzma to build or link.
lzma-rs = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"
todo = "warn"
cast_possible_truncation = "warn"

# gpui's own workspace patches these two crates, and a git dependency does not carry its
# consumer's patch table. Without them we would silently build gpui against different versions of
# its executor and Linux event loop than upstream tests against.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

# Telemetry and render paths must stay allocation- and panic-free; release builds are
# optimised hard because "extreme performance" is a stated goal (see DELIVERABLES.md).
[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
panic = "unwind"

[profile.bench]
inherits = "release"

# Dependencies compiled with optimisation even in dev: log parsing and replay rigs are
# unusably slow otherwise, while our own crates stay fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

# The camera's per-pixel loops (YUYV to RGBA, RGBA to BGRA) run for every frame at 30 a second:
# optimised like the dependencies, since a frame is a million pixels at 1280 x 720.
[profile.dev.package.mp-video]
opt-level = 2
