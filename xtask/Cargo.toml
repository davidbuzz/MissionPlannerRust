[package]
name = "xtask"
description = "Repository automation: codegen, ledger, invariants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
mp-mavlink.workspace = true
mp-mavlink-dialects.workspace = true
roxmltree.workspace = true
# `licences` reads `cargo metadata` for THIRD_PARTY_LICENSES's crate table.
serde_json.workspace = true
sha2.workspace = true

# codegen-resx parses every .ftl it generates back before writing it.
fluent-syntax.workspace = true

[dev-dependencies]
# tests/resx.rs formats the generated messages and compares them with the .NET strings.
fluent-bundle.workspace = true
unic-langid.workspace = true
# tests/graph.rs reads `cargo metadata`'s JSON. Already in the tree through mp-firmware, so it
# costs nothing to compile.
serde_json.workspace = true
