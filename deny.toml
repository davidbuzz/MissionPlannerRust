[licenses]
# The port derives from GPLv3 Mission Planner, so the workspace ships GPL-3.0-only: Mission
# Planner's COPYING.txt is the GNU GPL version 3 with no grant of a later version, and a
# derivative cannot add one. Inbound dependencies must be compatible with it; every crate's
# expression is checked against this list by xtask/tests/licences.rs as well as by cargo-deny,
# and THIRD_PARTY_LICENSES lists them all.
allow = [
    # This work.
    "GPL-3.0-only",
    # The permissive licences most crates carry.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
    "PSF-2.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause-Views",
    # malachite: the LGPL version 3 is the GPL version 3 with additional permissions, which the
    # GPL's section 7 lets this work remove, so it is conveyed here under the GPL.
    "LGPL-3.0-only",
]
confidence-threshold = 0.9

# Crates whose manifest names a licence file and no SPDX expression; the files are the Python
# Software Foundation licence, which the text matcher reads at too low a confidence to admit on
# its own (cargo-deny's run of 2026-10-03 gave these hashes). xtask::licence::CLARIFIED says the same.
[[licenses.clarify]]
name = "rustpython-doc"
expression = "PSF-2.0"
license-files = [{ path = "LICENSE", hash = 0x89e6df3c }]

[[licenses.clarify]]
name = "rustpython-pylib"
expression = "PSF-2.0"
license-files = [{ path = "Lib/PSF-LICENSE", hash = 0xe5f4697b }]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# gpui's text stack (rustybuzz, ttf-parser), fluent's unic crates and paste are transitive and
# unmaintained; the advisory is noted, and the workspace's own dependencies are held to it.
unmaintained = "workspace"
